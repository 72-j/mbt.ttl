# 子仓（thy1016/moonttl）CI
#
# 维护期形态（2026-11-20 评审拍，档 2）：
#   · static 作业（仅 Linux）= 静态门四件：`--deny-warn` + `fmt --warn` + `.mbti`
#     漂移门 + CI-6 净检出复跑（crlf）。静态门只跑一次：Windows 检出可能是 CRLF，
#     字节级比对（fmt / `moon info` 回写）在那边会误报。
#   · test 作业（ubuntu 单腿）= wasm（preferred_target）+ native 双档——moon 双
#     后端语义才是真分叉；平台矩阵（macos/windows + MSYS2 链）候退出维护期恢复
#     （C 产品面 lexerc_ffi.c 可移植性已由历史三 OS 全绿背书，维护期 C 面零改动）。
#   · schedule 周检 = 环境漂移哨：维护期 push 稀疏，工具链月级演进（20260915→
#     20260920→20261104→20261117）在 push 间隙静默积累——cron 让 known_good
#     漂移 warning 定期开火，防"六周红"复发（2026-11-07 解蔽清账先例）。
#   · 撤（活跃期独有；纪律不撤、只撤 CI 履行）：coverage/可达覆盖/TODO(P0) 三
#     棘轮、suite/coverage/perf 三复核面、文档门、锚点漂移门——牙口保留在套件
#     测试自身断言（缺口非零即 moon test 红）与本地收口笔（世界宪法 §6.5）；
#     基线/复核表四件（coverage-baseline / reachable-coverage-baseline /
#     suite-review / coverage-review / perf-review）留史，不再被 CI 消费。
#   · 不跑 `moon fmt`（写盘）——它会把"未格式化"悄悄改掉再宣布通过；格式门由
#     static 的 `fmt --warn` 承担，CI 因此只在"提交形态"上判定。
#   · 版本漂移可观测：CI 装的是最新工具链，static 作业与已知良好版本比对并打 warning。
#
# 本地已知良好工具链：**moon 0.1.20261117**（2026-11-19 跟升——冻结件升钉
# async 0.20.3→0.22.4（旧冻结源 `self.reader._xxx` 私有方法直调被新 moonc 拒）
# + fmt 尾逗号正典波 literal.mbt 同笔；前史 20261104 = fmt 新正典波；再前史
# CI-5 2026-09-23 勘正 20260915→20260920，同款"跟升即红不许分两笔"纪律）
name: Test

on:
  push:
  pull_request:
  schedule:
    # 周一 02:30 UTC：维护期环境漂移周哨（错峰整点，避 runner 拥挤）
    - cron: "30 2 * * 1"

# 同一 ref 的旧运行自动取消：省 runner，也避免排队导致的"看着像随机失败"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static gates (check --deny-warn / fmt --warn / .mbti drift / CI-6)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Moon env (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libssl-dev
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify MoonBit installation
        run: |
          moon --version
          moon version --all
          installed="$(moon --version | head -n 1 | awk '{print $2}')"
          # W18（2026-09-21，用户拍"CI 跟升"）：钉版随工具链演进而 bump
          # （20260915→20260920→20261104→**20261117**）——每次跟升与引入红的
          # 修正**同笔**（跟升即红，不许分两笔）；20261117 = 冻结件升钉
          # async 0.22.4 + fmt 尾逗号正典波（literal.mbt，2026-11-19 同笔）。
          # 跟随口径：CI 取**最新**已知良好版（本地钉回旧版会制造口径分叉）。
          known_good="0.1.20261117"
          if [ "$installed" != "$known_good" ]; then
            echo "::warning::MoonBit 工具链 $installed ≠ 本地已知良好 $known_good——先在本地复跑 check/test，再按需更新本文件"
          fi

      - name: Moon update
        run: |
          moon update

      - name: Static gates
        run: |
          moon check --deny-warn
          # 格式门：**全路径，无豁免**（2026-09-19 起；N5 治本）。用 `--warn`
          # 而不是 `--check`：它列出全部未格式化文件，不漏新目录。
          offenders="$(moon fmt --warn 2>&1 | sed -n 's/^File not formatted: //p' || true)"
          if [ -n "$offenders" ]; then
            echo "::error::以下文件未按内仓口径格式化："
            echo "$offenders"
            exit 1
          fi
          moon info
          # .mbti 漂移门（评审 P0-2）：生成物必须与产生它的改动同笔提交，
          # 否则"窄入口只开必要面"的公开面事实源不可信。
          drift="$(git status --porcelain -- '*.mbti')"
          if [ -n "$drift" ]; then
            echo "::error::.mbti 与源码漂移——本地跑 moon info，把 .mbti 与产生它的改动同笔提交"
            echo "$drift"
            exit 1
          fi

      - name: "净检出复跑（CI-6 元门：crlf 口径 = Windows 检出快速替身）"
        run: |
          # CI-6（2026-09-23 立）：**净检出复跑**——判据是"净检出绿"，不是"本地绿"。
          # 本步在临时克隆里以 `core.autocrlf=true` 复跑测试，用来抓 Windows 检出把
          # 文本件转 CRLF 打穿的"行尾敏感"一族。本作业自己的检出已是净检出，
          # 故 `lf` 口径不必再跑（本地两口径都跑：`sh ci/netcheck.sh lf|crlf`）。
          sh ci/netcheck.sh crlf

  test:
    name: Test (ubuntu; wasm + native)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 维护期单腿：wasm（preferred_target）+ native 双档保留（moon 双后端语义 =
    # 真分叉）；平台矩阵候退出维护期恢复。覆盖率插桩不跑——coverage 面（棘轮/
    # 复核）已退役，见文件头注；裸跑读数即可（套件自身断言含缺口清零牙）。

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Moon env (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libssl-dev
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify MoonBit installation
        run: |
          moon --version
          moon version --all

      - name: Moon update
        run: |
          moon update

      - name: Moon check (--deny-warn)
        run: |
          moon check --deny-warn

      - name: Moon test
        run: |
          echo "=== Wasm target ==="
          moon test --deny-warn

          echo "=== Native target ==="
          moon test --deny-warn --target native
