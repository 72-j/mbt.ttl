name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Moon env (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libssl-dev
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup Moon env (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install gcc openssl
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup Moon env (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup MSYS2 + MinGW + openssl (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl

      # 🔧 新增：验证 moon 是否可用
      - name: Verify MoonBit installation
        run: |
          moon --version
          moon version --all

      - name: Moon Check
        run: |
          moon fmt --check
          moon check --deny-warn
          moon info
          if ! git diff --exit-code; then
            echo "❌ .mbti files have changed after 'moon info'. Please run 'moon info' locally and commit the changes."
            exit 1
          fi
          git status

      - name: Moon test
        run: |
          echo "=== Wasm target ==="
          moon test --deny-warn --enable-coverage
          moon coverage report -f summary
          moon coverage analyze > coverage-wasm.log

          echo "=== Native target ==="
          moon test --deny-warn --target native --enable-coverage
          moon coverage report -f summary
          moon coverage analyze > coverage-native.log