name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Moon env (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libssl-dev
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup Moon env (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install gcc openssl
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup Moon env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 使用 Bypass 临时绕过执行策略，避免组策略冲突
          $installScript = Invoke-WebRequest -Uri "https://cli.moonbitlang.com/install/powershell.ps1" -UseBasicParsing
          $installScript.Content | powershell -ExecutionPolicy Bypass -Command -
          
          # 设置路径
          $moonPath = "$env:USERPROFILE\.moon\bin"
          echo "$moonPath" | Out-File -FilePath $env:GITHUB_PATH -Append
          
          # 关键：立刻将路径加入当前会话，以便后续命令生效
          $env:Path = "$moonPath;$env:Path"
          
          # 验证安装（此时 moon 已经在 PATH 中）
          moon --version

      - name: Setup MSYS2 + MinGW + openssl (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl

      - name: Verify MoonBit installation
        run: |
          moon --version
          moon version --all
          
      - name: Moon update
        run: |
          moon update

      - name: Moon Check
        run: |
          moon check
          moon fmt
          moon check --deny-warn
          moon info


      - name: Moon test
        run: |
          echo "=== Wasm target ==="
          moon test --deny-warn --enable-coverage
          moon coverage report -f summary
          moon coverage analyze > coverage-wasm.log

          echo "=== Native target ==="
          moon test --deny-warn --target native --enable-coverage
          moon coverage report -f summary
          moon coverage analyze > coverage-native.log