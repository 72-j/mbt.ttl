# 子仓（thy1016/moonttl）CI
#
# 重排依据（2026-09-18）：
#   · static 作业（仅 Linux）= 静态门：`--deny-warn` + `fmt --check` + `.mbti` 漂移门。
#     静态门只跑一次：Windows 检出可能是 CRLF，字节级比对（fmt / `moon info` 回写）在那边会误报。
#   · test 作业（3 OS 矩阵）= 只跑两道测试门，不写盘。
#   · 不再跑 `moon fmt`（写盘）——它会把"未格式化"悄悄改掉再宣布通过；格式门由 static 的
#     `moon fmt --check` 承担，CI 因此只在"提交形态"上判定。
#   · 版本漂移可观测：CI 装的是最新工具链，static 作业与已知良好版本比对并打 warning。
#
# 本地已知良好工具链：**moon 0.1.20260920 (914d7da 2026-09-20)**（CI-5 2026-09-23 勘正——
# 原注释写 20260915 系跟升前沿革，与下方 `known_good` 值不一致）
name: Test

on:
  push:
  pull_request:

# 同一 ref 的旧运行自动取消：省 runner，也避免排队导致的"看着像随机失败"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static gates (check --deny-warn / fmt --check / .mbti drift)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Moon env (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libssl-dev
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify MoonBit installation
        run: |
          moon --version
          moon version --all
          installed="$(moon --version | head -n 1 | awk '{print $2}')"
          # W18（2026-09-21，用户拍"CI 跟升"）：钉版 20260915 → **20260920**——
          # 与"弃用诊断清偿（implicit_impl_as_method 70+16 处）"**同笔**（跟升即红，不许分两笔）。
          # 跟随口径：CI 取**最新**已知良好版（本地钉回旧版会制造口径分叉）。
          known_good="0.1.20260920"
          if [ "$installed" != "$known_good" ]; then
            echo "::warning::MoonBit 工具链 $installed ≠ 本地已知良好 $known_good——先在本地复跑 check/test，再按需更新本文件"
          fi

      - name: Moon update
        run: |
          moon update

      - name: Static gates
        run: |
          moon check --deny-warn
          # 格式门：**全路径，无豁免**（2026-09-19 起；N5 治本）。
          # 勘误（§AL）：旧版按路径豁免 `src/gen_n3v2/quicktest/`，理由是"再生件按外层口径落盘、
          # 内仓口径会重排"。实测证伪——trig 实例在 scratch 上 fmt 零变化，n3v2 实例只是**没跟工具链
          # 格式化**（现行口径下 model_exec 1119 → 4659 行）。已按"入库形 = fmt(生成形)"统一重排，
          # 豁免清零；用 `--warn` 而不是 `--check`：它列出全部未格式化文件，不漏新目录。
          offenders="$(moon fmt --warn 2>&1 | sed -n 's/^File not formatted: //p' || true)"
          if [ -n "$offenders" ]; then
            echo "::error::以下文件未按内仓口径格式化（再生件路径已按 §Q.3-F1 裁定豁免）："
            echo "$offenders"
            exit 1
          fi
          moon info
          # .mbti 漂移门（评审 P0-2）：生成物必须与产生它的改动同笔提交，
          # 否则"窄入口只开必要面"的公开面事实源不可信。
          drift="$(git status --porcelain -- '*.mbti')"
          if [ -n "$drift" ]; then
            echo "::error::.mbti 与源码漂移——本地跑 moon info，把 .mbti 与产生它的改动同笔提交"
            echo "$drift"
            exit 1
          fi

      - name: Coverage gate (ratchet)
        run: |
          # 覆盖率棘轮：只许 ≥ 基线（coverage-baseline.txt），不许倒退。
          # 口径固定（见 coverage-baseline.txt）：moon clean → coverage clean → 带插桩跑一遍 → summary 末行。
          # `moon clean` 不可省：源码改动后 _build 里的旧插桩产物会与新产物混跑 ⇒ trace 对不上直接报错。
          moon clean
          moon coverage clean
          moon test --enable-coverage
          summary="$(moon coverage report -f summary | tail -n 1)"
          echo "coverage summary: $summary"
          counts="$(echo "$summary" | sed -nE 's/^Total: ([0-9]+)\/([0-9]+)$/\1 \2/p')"
          if [ -z "$counts" ]; then
            echo "::error::无法从 summary 解析覆盖计数（格式变了？）：$summary"
            exit 1
          fi
          covered="$(echo "$counts" | awk '{print $1}')"
          total="$(echo "$counts" | awk '{print $2}')"
          permille=$(( covered * 1000 / total ))
          baseline="$(sed -nE 's/^covered_permille *= *([0-9]+).*/\1/p' coverage-baseline.txt)"
          echo "covered=$covered/$total = ${permille}‰；基线 ${baseline}‰"
          if [ "$permille" -lt "$baseline" ]; then
            echo "::error::覆盖率倒退：${permille}‰ < 基线 ${baseline}‰——补测试，或（有理由时）同笔下调 coverage-baseline.txt"
            exit 1
          fi
          if [ "$permille" -gt "$baseline" ]; then
            echo "::notice::覆盖率高于基线（${permille}‰ > ${baseline}‰）——请同笔把 coverage-baseline.txt 推上去"
          fi

      - name: "Reachable command-name coverage (缺口清零 + 分母棘轮)"
        run: |
          # 口径见 src/ttl/reachable-coverage-baseline.txt：
          #   分母 = reachable_witness_paths() 派生（不可达项不进分母）；
          #   分子 = 实际执行的 RunReport.command_distribution 并集（不是路径声明）。
          # 本步只核"缺口=0 + 分母不缩水 + 钉子数不增"；口径级断言在测试内部（更严）。
          base_val() { # $1=方言 $2=键
            awk -v d="$1" -v k="$2" '
              $0 == "[" d "]" { f = 1; next }
              /^\[/ { f = 0 }
              f && $1 == k { print $3 }
            ' reachable-coverage-baseline.txt
          }
          for d in trig nquads n3v2; do
            out="$(moon test "src/gen_$d/quicktest" 2>&1)"
            line="$(printf '%s\n' "$out" | grep -o "可达覆盖账 $d：分母 [0-9]* / 分子 [0-9]* / 缺口 [0-9]* / 不可达 [0-9]*" | head -n 1)"
            if [ -z "$line" ]; then
              echo "::error::[$d] 没有找到可达覆盖账输出行——门没跑起来？"
              printf '%s\n' "$out" | tail -n 20
              exit 1
            fi
            total="$(printf '%s\n' "$line" | sed -nE 's/.*分母 ([0-9]+) .*/\1/p')"
            covered="$(printf '%s\n' "$line" | sed -nE 's/.*分子 ([0-9]+) .*/\1/p')"
            missing="$(printf '%s\n' "$line" | sed -nE 's/.*缺口 ([0-9]+) .*/\1/p')"
            pinned="$(printf '%s\n' "$line" | sed -nE 's/.*不可达 ([0-9]+)$/\1/p')"
            base_total="$(base_val "$d" reachable_total)"
            base_pinned="$(base_val "$d" unreachable_pinned)"
            echo "[$d] 分母=$total 分子=$covered 缺口=$missing 不可达=$pinned（基线：分母=$base_total 钉子=$base_pinned）"
            if [ "$missing" -ne 0 ]; then
              echo "::error::[$d] 可达覆盖有缺口 $missing 个——补脚本，或按账头把不可达项移出分母（并给反向断言）"
              exit 1
            fi
            if [ "$total" -lt "$base_total" ]; then
              echo "::error::[$d] 分母缩水：$total < 基线 $base_total（防「把可达项挪出分母刷比率」）"
              exit 1
            fi
            if [ "$total" -gt "$base_total" ]; then
              echo "::notice::[$d] 分母涨到 $total（> 基线 $base_total）——请同笔推 reachable-coverage-baseline.txt"
            fi
            if [ "$pinned" -gt "$base_pinned" ]; then
              echo "::error::[$d] 不可达钉子数增加：$pinned > $base_pinned——新增不可达项必须同笔说明并配反向断言"
              exit 1
            fi
          done

      - name: "复核面（可复现性检查，§6.5）"
        run: |
          # 复核面判据（世界宪法 §6.5）= **可复现 + 缺口有解释**（禁止"分数不降"作判据）。
          # 本步只做"可复现"这一半：同命令重生成（零纸解析：原样收纳套件自报行）≡ 入库复核表（逐字节）。
          # "缺口有解释"这一半 = `review.md` §1.2 缺口解释表（人工复核面，随 review 换版刷新）。
          # 缺口清零这一半 = 各套件测试**自身断言**（非零即 `moon test` 红，见 test 作业）。
          gen="$(mktemp)"
          {
            for d in n3v2 nquads trig; do
              echo "[$d]"
              moon test "src/gen_$d" 2>&1 | grep -oE '=== [^"]+ ===' | sed 's/^=== //;s/ ===$//' | sort -u
            done
          } > "$gen"
          if ! diff -u <(grep -v '^#' suite-review.txt | sed '/^$/d') "$gen"; then
            echo "::error::复核表不可复现：同命令重生成与入库 suite-review.txt 不一致——若确为预期变更（套件增删行），请同笔重生成复核表并刷新 review.md §1.2"
            exit 1
          fi
          echo "复核面：同命令重生成 ≡ 入库复核表（逐字节）⇒ 可复现 ✓"

      - name: "复核面·覆盖率（可复现性检查，§6.5）"
        run: |
          # 复核面判据（世界宪法 §6.5）= **可复现 + 缺口有解释**（禁止"分数不降"作判据）。
          # 本步 = 面三（覆盖率读数面）：同命令（冷口径两量）重生成 ≡ 入库 `coverage-review.txt`（逐字节）。
          # 注意：读数随代码变化 ⇒ 改代码**必须同笔重生成**本表（否则本步红，报错文案已写明）。
          # 棘轮（时间维度）不归本面：基线文件管（§6.5.6 二者不可互替）。
          gen="$(mktemp)"
          moon clean
          moon coverage clean
          moon test --enable-coverage > /dev/null 2>&1
          {
            echo "[行覆盖]"
            moon coverage report -f summary | tail -n 1
            echo "[可达命令名覆盖]"
            moon test 2>&1 | grep -o '可达覆盖账 [a-z0-9]*[^：]*：分母 [0-9]* / 分子 [0-9]* / 缺口 [0-9]* / 不可达 [0-9]*' | sort -u
          } > "$gen"
          if ! diff -u <(grep -v '^#' coverage-review.txt | sed '/^$/d') "$gen"; then
            echo "::error::覆盖率复核表不可复现：同命令重生成与入库 coverage-review.txt 不一致——请同笔重生成并刷新 review.md §1.2"
            exit 1
          fi
          echo "复核面·覆盖率：同命令重生成 ≡ 入库表（逐字节）⇒ 可复现 ✓"

      - name: "复核面·性能（可复现性检查，§6.5）"
        run: |
          # 复核面判据（世界宪法 §6.5）= **可复现 + 缺口有解释**。
          # 本步 = 面四（性能读数面）：性能读数**有抖动、跨机不可比** ⇒
          #   **比较体只放机器无关的相对判据**（同机同命令下的序关系 + 量级带）；
          #   **绝对读数只作留证**（::notice:: 打印 + 表内 `#` 注释），**不参与逐字节比对**。
          # 判据：① 比较体同命令重生成**逐字节一致**；② 相对判据**全为 true**（false 即 diff 红）。
          # 口径：正式数字只取 `--target native --release`（debug 慢 4.6×，不作结论）。
          gen="$(mktemp)"
          bench="$(moon run src/bench/nquads-benchmark --target native --release src/bench/test_10000.nq 2>/dev/null)"
          lex="$(moon test --target native --release src/gen_nquads -f "*词法役 P1*" 2>/dev/null)"
          lx=$(printf '%s\n' "$bench" | awk '/^Lexer:/{print $2}')
          en=$(printf '%s\n' "$bench" | awk '/^Parser:/{print $2}')
          va=$(printf '%s\n' "$bench" | awk '/^验证:/{print $2}')
          ma=$(printf '%s\n' "$bench" | awk '/^物化:/{print $2}')
          tps=$(printf '%s\n' "$bench" | awk '/^每秒解析:/{printf "%.2f", $2/1000000}')
          lm=$(printf '%s\n' "$lex" | awk '/10k 真实语料/{print $8}')
          lc=$(printf '%s\n' "$lex" | awk '/10k 真实语料/{print $17}')
          gt() { awk -v a="$1" -v b="$2" 'BEGIN{print (a>b)?"true":"false"}'; }
          {
            echo "[段序判据（10k / native release）]"
            echo "验证 > 引擎 = $(gt "$va" "$en")"
            echo "引擎 > 物化 = $(gt "$en" "$ma")"
            echo "验证 > 词法 = $(gt "$va" "$lx")"
            echo "[档位与词法判据]"
            echo "吞吐 > 0.5M quads/s = $(gt "$tps" 0.5)"
            echo "词法(Lexermoon) > C-FFI(Lexerc) = $(gt "$lm" "$lc")"
          } > "$gen"
          echo "::notice::性能留证读数（机器相关，只作展示）：词法 ${lx}µs / 引擎 ${en}µs / 验证 ${va}µs / 物化 ${ma}µs / 吞吐 ${tps}M quads/s / Lexermoon ${lm}M vs Lexerc ${lc}M tok/s"
          if ! diff -u <(grep -v '^#' perf-review.txt | sed '/^$/d') "$gen"; then
            echo "::error::性能复核表不可复现：同命令重生成的**相对判据体**与入库 perf-review.txt 不一致——若判据确已改变，请同笔刷新本表并更新 review.md §1.2；若只是读数异常，查档位（必须 native + release）"
            exit 1
          fi
          echo "复核面·性能：相对判据体同命令重生成 ≡ 入库表（逐字节）⇒ 可复现 ✓"

      - name: "Default arms bookkeeping (TODO(P0) 计数门)"
        run: |
          # 默认臂 = "未识别 action/event" 的**保守臂**：能跑、但响应正确性没有判据（默认臂≠已验证）。
          # 纪律（评审 P1-4）：数量变化必须同笔说明——否则模型可能悄悄退化成 90% 保守臂而门全绿。
          # 名单侧另有 gen_trig/quicktest/metrics.mbt 的 default_arms()（30 条逐条断言合法+保守档），
          # 两处一起才防得住"多一条保守臂"。
          check_default_arms() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(grep -c 'TODO(P0):' "$path" || true)"
            echo "$path: TODO(P0): = $actual（期望 $expected）"
            if [ "$actual" -ne "$expected" ]; then
              echo "::error::默认臂数量变化：$path 实得 $actual，期望 $expected——默认臂≠已验证，增减必须同笔说明并更新本门"
              return 1
            fi
          }
          check_default_arms src/gen_trig/quicktest/model_exec.mbt 30
          # 49 → 48（R-17 转正同笔，2026-09-20）：set_id_subject 真臂化（帧位
          # id_subject + 条件 ret_state=flag:as_subject）——(BnpExpectIdNode, PrefName)
          # 保守臂退役；剩 1 臂 = (BnpExpectPredicate, Id) 表行**无 action 声明**
          # （默认 Continue 恰为真值；表源缺口另立，非生成器债）。
          check_default_arms src/gen_n3v2/quicktest/model_exec.mbt 48

      - name: "文档门（guides/** 结构：H1 / 导航 / 零死链 / 命名 / 无孤岛）"
        run: sh ci/docs-check.sh

      - name: "锚点漂移门（*.mbt:NNN 引用）"
        run: sh ci/anchor-check.sh

      - name: "净检出复跑（CI-6 元门：crlf 口径 = Windows 检出快速替身）"
        run: |
          # CI-6（2026-09-23 立）：**净检出复跑**——判据是"净检出绿"，不是"本地绿"。
          # 本步在临时克隆里以 `core.autocrlf=true` 复跑测试，用来抓 Windows 检出把文本件
          # 转 CRLF 打穿的"行尾敏感"一族（实测：`n3tests_suite_wbtest` 读 `parser_index.tsv`
          # 后按 `\n` 切行 ⇒ 路径带 `\r` ⇒ OSError）。本作业自己的检出已是净检出，
          # 故 `lf` 口径不必再跑（本地两口径都跑：`sh ci/netcheck.sh lf|crlf`）。
          sh ci/netcheck.sh crlf

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # CI-4（2026-09-23）**平台矩阵策略**：Windows **保留逐字节黄金门**，不做平台豁免——
    # CI-2 行尾治本后它就是"跨平台可复现"的真判据（平台豁免会让判据失去跨机效力）。
    # 分工：CRLF 类问题由 static 作业的 **CI-6 元门**（`sh ci/netcheck.sh crlf`）**先**抓
    # （Linux 上快速失败、省三 OS 排队）；本矩阵继续承担**真机集成**（路径分隔符 / 工具链安装 /
    # native 目标 / MSYS2 链接）。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Moon env (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libssl-dev
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup Moon env (macOS)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install gcc openssl
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 1. 绕过执行策略限制（更彻底）
          powershell -ExecutionPolicy Bypass -Command "irm https://cli.moonbitlang.com/install/powershell.ps1 | iex"

          # 2. 将 moon 加入当前会话的 PATH
          $moonPath = "$env:USERPROFILE\.moon\bin"
          echo "$moonPath" | Out-File -FilePath $env:GITHUB_PATH -Append
          $env:Path += ";$moonPath"

          # 3. 验证安装
          moon --version

      - name: Setup MSYS2 + MinGW + openssl (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # 原 true：pacman 全量升级是 Windows 侧最常见的超时/失败源（本项目 native 只是补充档）
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl

      - name: Verify MoonBit installation
        run: |
          moon --version
          moon version --all

      - name: Moon update
        run: |
          moon update

      - name: Moon check (--deny-warn)
        run: |
          moon check --deny-warn

      - name: Moon test
        run: |
          echo "=== Wasm target ==="
          moon test --deny-warn --enable-coverage
          moon coverage report -f summary
          moon coverage analyze > coverage-wasm.log

          echo "=== Native target ==="
          moon test --deny-warn --target native --enable-coverage
          moon coverage report -f summary
          moon coverage analyze > coverage-native.log
