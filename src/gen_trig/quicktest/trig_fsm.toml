# ==========================================================
# 9. 收拾链（Scope Chains）：每个变体显式列出"清谁"，未列字段一律保留
# ==========================================================

[[scope_chains]]
enum = "ResetScope"
variant = "Object"
resets = ["object"]

[[scope_chains]]
enum = "ResetScope"
variant = "PredObj"
resets = ["predicate", "object"]

[[scope_chains]]
enum = "ResetScope"
variant = "SPO"
resets = ["subject", "predicate", "object"]
doc = "TriG 图块口径"

[[scope_chains]]
enum = "ResetScope"
variant = "All"
resets = ["subject", "predicate", "object", "graph"]
doc = "N-Quads 行口径"
# ==========================================================
# 10. 声明面动作（Trait Actions）：engine 直接调用，不走转移表
# ==========================================================

[[actions]]
name = "list_step"
params = ["Span"]
comment = "集合链推进：节点序号 +1，s 槽切新节点 + first 标记 + 元素落 o 槽"

[[actions]]
name = "open_slot"
params = ["Span", "SlotType", "State"]
comment = "嵌套元素开帧：链发射后兑现 OpenSlot"

[[actions]]
name = "pop_bnode_prop"
params = []
comment = "] 属性列表收口：弹帧恢复外层槽位与返回状态"
# ==========================================================
# 7. 上下文/字段定义（Context）
# ==========================================================

[context]
frame_fields = ["subject", "predicate"]

fields = [
  { name = "emit_queue", type = "Array[TrigPendingQuad]", default = "[]" },
  { name = "subject", type = "Span?" },
  { name = "predicate", type = "Span?" },
  { name = "object", type = "Span?" },
  { name = "graph", type = "Span?" },
  { name = "prefix_name", type = "Span?" },
  { name = "base", type = "Span?" },
  { name = "directive_at", type = "Bool", default = "false" },
  { name = "prefixes", type = "Array[(Span, Span)]", default = "[]" },
  { name = "bases", type = "Array[Span]", default = "[]" },
  { name = "kw_ledger", type = "Array[Span]", default = "[]" },
  { name = "kw_directive_seen", type = "Bool", default = "false" },
  { name = "slot_stack", type = "Array[Slot]", default = "[]" },
  { name = "pred_kind", type = "PredKind", default = "Normal" },
  { name = "annot_s", type = "Span?" },
  { name = "annot_o", type = "Span?" },
  { name = "subj_shell", type = "Bool", default = "false" },
  { name = "annot_p", type = "Span?" },
  { name = "annot_seq", type = "Int", default = "0" },
  { name = "s_shell_seq", type = "Int?" },
  { name = "bound_reifier", type = "Span?" },
  { name = "reifiers", type = "Array[Span]", default = "[]" },
  { name = "annot_stack", type = "Array[AnnotFrame]", default = "[]" },
]

[[context.snapshot_extras]]
name = "pk"
type = "PredKind"
expr = "self.pred_kind"
reset = "Normal"

[[context.snapshot_extras]]
name = "prefix_version"
type = "Int"
expr = "self.prefixes.length()"

[[context.snapshot_extras]]
name = "base_version"
type = "Int"
expr = "self.bases.length()"

[[context.snapshot_extras]]
name = "subj_shell"
type = "Bool"
expr = "self.subj_shell"

[[context.snapshot_extras]]
name = "anchor_p"
type = "Span?"
expr = "self.annot_p"

[[context.snapshot_extras]]
name = "anchor_o"
type = "Span?"
expr = "self.annot_o"

[[context.snapshot_extras]]
name = "annot_seq"
type = "Int"
expr = "self.annot_seq"

[[context.snapshot_extras]]
name = "s_shell_seq"
type = "Int?"
expr = "self.s_shell_seq"

[[context.snapshot_extras]]
name = "bound_reifier"
type = "Span?"
expr = "self.bound_reifier"

[[context.snapshot_extras]]
name = "reifiers"
type = "Array[Span]"
expr = "self.reifiers"
reset = "[]"
