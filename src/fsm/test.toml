  version = 1

  [events]
  start = []
  stop = []
  pause = []
  resume = []

  [states]

  [states.idle]
  is_initial = true

  [states.running]

  [states.paused]

  [[transitions]]
  from = "idle"
  to = "running"
  on = "start"

  [[transitions]]
  from = "running"
  to = "idle"
  on = "stop"

  [[transitions]]
  from = "running"
  to = "paused"
  on = "pause"

  [[transitions]]
  from = "paused"
  to = "running"
  on = "resume"
