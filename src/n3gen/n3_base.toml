# ==========================================================
# N3 FSM 声明面词表 · base 段（v1 表即文件，ADR-GEN-N3 §5.13 役14）
# 事实源：本文件 + n3_trans.toml（同目录）；产物 = n3_fsm.toml（IR 兼容）
# 验收门：n3gen dump ≡ 外层 src/rdf/fsm_out/n3_fsm.toml 逐字节（测试钉死）
# 注释为编辑向导，编译器解析期忽略；字段序自由（dump 侧规范化）
# ==========================================================

[meta]
name = "n3_parser"
dialect = "n3"
version = "0.1.0"
prefix = "N3"
trait_name = "N3"
style = "mutable"

# ----------------------------------------------------------
# 方言段：capabilities（prune 消费）+ enums（codegen emit_enums 消费）
# ----------------------------------------------------------


[dialect.n3]
capabilities = ["prefix", "base", "keyword_a", "triple_term", "bracket_triple_term", "version", "annotation", "reifier", "formula", "variable", "path", "keywords", "is_of", "same_as"]

[[dialect.n3.enums]]
name = "N3Dialect"
doc = "方言开关（生成契约不引用，引擎 loop 用）：N3 = 默认扩展；RDFStarOff 暂不开放"
variants = ["N3", "RDFStarOff"]
emit = false

[[dialect.n3.enums]]
name = "PredKind"
doc = "谓词来源标记（管线同源快照槽）：ADR-003a 集合恒 Normal；RDFFirst/RDFRest 仅为 ADR-003b 显式链物化预留；KwA = 'a' 关键词谓词（役5，引擎归位点裁定活性、set_predicate 消费落账）；SameAs = `=` 等同谓词（役7，token span 占谓词槽、owl:sameAs 出账）"
variants = ["Normal", "RDFFirst", "RDFRest", "KwA", "SameAs"]

# ----------------------------------------------------------
# 事件定义（Events）：声明序 = 生成枚举序
# ----------------------------------------------------------

[[events]]
name = "Iri"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "BlankNode"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "Literal"
payload = [{ name = "span", type = "Span" }, { name = "lang", type = "Span?" }]

[[events]]
name = "PrefName"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "TripleTerm"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "BracketTripleTerm"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "KeywordA"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "Variable"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "KeywordX"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "Equals"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "Is"

[[events]]
name = "Of"

[[events]]
name = "Has"

[[events]]
name = "At"

[[events]]
name = "PrefixKw"

[[events]]
name = "BaseKw"

[[events]]
name = "VersionKw"

[[events]]
name = "Tilde"

[[events]]
name = "AnnotStart"

[[events]]
name = "AnnotEnd"

[[events]]
name = "ForAllKw"

[[events]]
name = "ForSomeKw"

[[events]]
name = "KeywordsKw"

[[events]]
name = "Comma"

[[events]]
name = "Semicolon"

[[events]]
name = "Dot"

[[events]]
name = "Lbrace"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "Rbrace"

[[events]]
name = "Lbracket"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "Rbracket"

[[events]]
name = "Lparen"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "Rparen"

[[events]]
name = "Anon"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "Bang"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "Caret"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "Implies"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "ImpliedBy"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "Unknown"
payload = [{ name = "span", type = "Span" }]

[[events]]
name = "EOF"

# ----------------------------------------------------------
# 状态定义（States）：is_initial 恰一个
# ----------------------------------------------------------

[[states]]
name = "ExpectSubject"
is_initial = true

[[states]]
name = "ExpectPredicate"

[[states]]
name = "ExpectObject"

[[states]]
name = "ExpectDotOrGraph"

[[states]]
name = "ExpectDirectiveKind"

[[states]]
name = "ExpectPrefixName"

[[states]]
name = "ExpectPrefixIri"

[[states]]
name = "ExpectBaseIri"

[[states]]
name = "ExpectVersionLiteral"

[[states]]
name = "ExpectDirectiveEnd"

[[states]]
name = "ExpectKeywordsList"

[[states]]
name = "ExpectVerbOrEnd"

[[states]]
name = "ExpectVerbOrDot"

[[states]]
name = "ExpectVerbRequired"

[[states]]
name = "ExpectTildeEnd"

[[states]]
name = "AnnotExpectVerb"

[[states]]
name = "AnnotExpectVerbTail"

[[states]]
name = "AnnotExpectObject"

[[states]]
name = "AnnotExpectEnd"

[[states]]
name = "BnpExpectPredicate"

[[states]]
name = "BnpExpectObject"

[[states]]
name = "BnpAfterObject"

[[states]]
name = "ListExpectElemOrEnd"

[[states]]
name = "ListAfterElem"

[[states]]
name = "FormulaExpectSubject"

[[states]]
name = "FormulaExpectPredicate"

[[states]]
name = "FormulaExpectObject"

[[states]]
name = "FormulaAfterObject"

[[states]]
name = "PathExpectVerb"

[[states]]
name = "PathAfterStep"

[[states]]
name = "FormulaPathExpectVerb"

[[states]]
name = "FormulaPathAfterStep"

[[states]]
name = "ExpectIsProp"

[[states]]
name = "ExpectIsOf"

[[states]]
name = "BnpExpectIsProp"

[[states]]
