name = "ObjTrailExpectVerb"

[[states]]
name = "ObjTrailAfterStep"

# ----------------------------------------------------------
# Effect 定义（Effects）：semantics 驱动 interpret 分组
# ----------------------------------------------------------

[[effects]]
name = "Continue"
semantics = "continue"

[[effects]]
name = "EmitQuad"
semantics = "emit"
payload = [{ name = "scope", type = "ResetScope" }]

[[effects]]
name = "Reset"
semantics = "reset"
payload = [{ name = "scope", type = "ResetScope" }]

[[effects]]
name = "Done"
semantics = "stop"

[[effects]]
name = "Sequence"
semantics = "sequence"
payload = [{ name = "effects", type = "Array[N3Effect]" }]

[[effects]]
name = "PopBnp"
semantics = "hook"

[[effects]]
name = "OpenSlot"
semantics = "hook"
payload = [{ name = "span", type = "Span" }, { name = "typ", type = "SlotType" }, { name = "ret_state", type = "State" }]

# ----------------------------------------------------------
# 收拾链（Scope Chains）：每个变体显式列出"清谁"，未列字段一律保留
# ----------------------------------------------------------

[[scope_chains]]
enum = "ResetScope"
variant = "Object"
resets = ["object"]

[[scope_chains]]
enum = "ResetScope"
variant = "PredObj"
resets = ["predicate", "object"]

[[scope_chains]]
enum = "ResetScope"
variant = "SPO"
resets = ["subject", "predicate", "object"]
doc = "N3 口径：无图块，g 槽恒默认图"

[[scope_chains]]
enum = "ResetScope"
variant = "All"
resets = ["subject", "predicate", "object", "graph"]
doc = "N3 语句全清口径"

# ----------------------------------------------------------
# 声明面动作（Trait Actions）：engine 直调，按名排序
# ----------------------------------------------------------

[[actions]]
name = "open_slot"
params = ["Span", "SlotType", "State"]
comment = "嵌套元素开帧：弹帧回集合区后兑现 OpenSlot"

[[actions]]
name = "pop_bnode_prop"
params = []
comment = "] 属性列表收口：弹帧恢复外层槽位与返回状态"

# ----------------------------------------------------------
# 上下文/字段定义（Context）+ 快照附加字段
# ----------------------------------------------------------

# ==========================================================
# 7. 上下文/字段定义（Context）
# ==========================================================

[context]
frame_fields = ["subject", "predicate"]

fields = [
  { name = "subject", type = "Span?" },
  { name = "predicate", type = "Span?" },
  { name = "object", type = "Span?" },
  { name = "graph", type = "Span?" },
  { name = "prefix_name", type = "Span?" },
  { name = "base", type = "Span?" },
  { name = "directive_at", type = "Bool", default = "false" },
  { name = "prefixes", type = "Array[(Span, Span)]", default = "[]" },
  { name = "bases", type = "Array[Span]", default = "[]" },
  { name = "slot_stack", type = "Array[Slot]", default = "[]" },
  { name = "pred_kind", type = "PredKind", default = "Normal" },
  { name = "variable_name", type = "Span?" },
  { name = "path_src", type = "Span?" },
  { name = "path_fwd", type = "Bool", default = "false" },
  { name = "path_pend", type = "Span?" },
  { name = "path_tail", type = "Span?" },
  { name = "rule_side", type = "RuleSide?" },
  { name = "iri_upcast", type = "Int", default = "0" },
  { name = "version_lit_ok", type = "Bool", default = "false" },
  { name = "kw_ledger", type = "Array[Span]", default = "[]" },
  { name = "kw_directive_seen", type = "Bool", default = "false" },
  { name = "kw_a_live", type = "Bool", default = "false" },
  { name = "is_src", type = "Span?" },
  { name = "is_depth", type = "Int", default = "0" },
  { name = "annot_s", type = "Span?" },
  { name = "annot_o", type = "Span?" },
  { name = "subj_shell", type = "Bool", default = "false" },
  { name = "annot_close", type = "Bool", default = "false" },
]

[[context.snapshot_extras]]
name = "pk"
type = "PredKind"
expr = "self.pred_kind"

[[context.snapshot_extras]]
name = "pver"
type = "Int"
expr = "self.prefixes.length()"

[[context.snapshot_extras]]
name = "bver"
type = "Int"
expr = "self.bases.length()"

[[context.snapshot_extras]]
name = "iver"
type = "Int"
expr = "self.iri_upcast"

[[context.snapshot_extras]]
name = "subj_shell"
type = "Bool"
expr = "self.subj_shell"
